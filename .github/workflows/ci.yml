name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  linux:
    name: Linux fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.2

      - name: Validate API contract
        run: goctl api validate --api apps/system/api/system.api

      - name: Test with race detector and coverage
        run: |
          mkdir -p coverage
          go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage/unit.txt ./...

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/unit.txt
          disable_search: true
          flags: unit
          name: dogx-unit
          fail_ci_if_error: false

  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -shuffle=on -count=1 ./...

  postgres-integration:
    name: PostgreSQL 18, Redis 7.4 and etcd integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: dogx_test
          POSTGRES_USER: dogx
          POSTGRES_PASSWORD: dogx_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dogx -d dogx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOGX_TEST_POSTGRES_DSN: postgres://dogx:dogx_test_password@127.0.0.1:5432/dogx_test?sslmode=disable
      DOGX_TEST_REDIS_HOST: 127.0.0.1:6379
      DOGX_TEST_ETCD_BINARY: ${{ runner.temp }}/dogx-etcd/etcd

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install isolated etcd test binary
        run: |
          curl --fail --location --retry 3 -o "${{ runner.temp }}/etcd.tar.gz" https://github.com/etcd-io/etcd/releases/download/v3.5.21/etcd-v3.5.21-linux-amd64.tar.gz
          curl --fail --location --retry 3 -o "${{ runner.temp }}/etcd-SHA256SUMS" https://github.com/etcd-io/etcd/releases/download/v3.5.21/SHA256SUMS
          expected=$(awk '$2 == "etcd-v3.5.21-linux-amd64.tar.gz" {print $1}' "${{ runner.temp }}/etcd-SHA256SUMS")
          test -n "$expected"
          echo "$expected  ${{ runner.temp }}/etcd.tar.gz" | sha256sum --check
          mkdir -p "${{ runner.temp }}/dogx-etcd"
          tar -xzf "${{ runner.temp }}/etcd.tar.gz" -C "${{ runner.temp }}/dogx-etcd" --strip-components=1

      - name: Test service wiring, migrations, repositories and distributed triggering
        run: |
          mkdir -p coverage
          go test -tags=integration -shuffle=on -count=1 -timeout=5m -covermode=atomic -coverprofile=coverage/integration.txt ./apps/system/api/internal/... ./apps/system/internal/... ./apps/system/rpc/internal/... ./apps/job/internal/... ./apps/job/rpc/internal/...

      - name: Test authentication and RBAC end to end
        env:
          DOGX_E2E_RPC_BINARY: ${{ runner.temp }}/dogx-bin/system-rpc
          DOGX_E2E_API_BINARY: ${{ runner.temp }}/dogx-bin/system-api
        run: |
          mkdir -p "${{ runner.temp }}/dogx-bin"
          go build -o "$DOGX_E2E_RPC_BINARY" ./apps/system/rpc
          go build -o "$DOGX_E2E_API_BINARY" ./apps/system/api
          go test -tags=integration,e2e -shuffle=on -count=1 -timeout=3m ./apps/system/e2e

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/integration.txt
          disable_search: true
          flags: integration
          name: dogx-integration
          fail_ci_if_error: false
