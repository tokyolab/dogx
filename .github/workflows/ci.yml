name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.2

      - name: Validate API contract
        run: goctl api validate --api apps/system/api/system.api

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -shuffle=on -count=1 ./...

  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -shuffle=on -count=1 ./...

  postgres-integration:
    name: PostgreSQL 18 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: dogx_test
          POSTGRES_USER: dogx
          POSTGRES_PASSWORD: dogx_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dogx -d dogx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOGX_TEST_POSTGRES_DSN: postgres://dogx:dogx_test_password@127.0.0.1:5432/dogx_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test PostgreSQL migrations and repositories
        run: go test -tags=integration -shuffle=on -count=1 -timeout=2m ./apps/system/internal/...
