name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify modules
        run: go mod verify

      - name: Install goctl
        run: go install github.com/zeromicro/go-zero/tools/goctl@v1.10.2

      - name: Validate API contract
        run: goctl api validate --api apps/system/api/system.api

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: |
          mkdir -p coverage
          go test -race -shuffle=on -count=1 -covermode=atomic -coverprofile=coverage/unit.txt ./...

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/unit.txt
          disable_search: true
          flags: unit
          name: dogx-unit
          fail_ci_if_error: false

  windows:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test -shuffle=on -count=1 ./...

  postgres-integration:
    name: PostgreSQL 18 and Redis 7.4 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: dogx_test
          POSTGRES_USER: dogx
          POSTGRES_PASSWORD: dogx_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dogx -d dogx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4.11-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOGX_TEST_POSTGRES_DSN: postgres://dogx:dogx_test_password@127.0.0.1:5432/dogx_test?sslmode=disable
      DOGX_TEST_REDIS_HOST: 127.0.0.1:6379

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test service wiring, migrations and repositories
        run: |
          mkdir -p coverage
          go test -tags=integration -shuffle=on -count=1 -timeout=2m -covermode=atomic -coverprofile=coverage/integration.txt ./apps/system/api/internal/... ./apps/system/internal/... ./apps/system/rpc/internal/...

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/integration.txt
          disable_search: true
          flags: integration
          name: dogx-integration
          fail_ci_if_error: false
