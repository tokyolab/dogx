Name: system-api
Host: 0.0.0.0
Port: 8001
Mode: dev
Timeout: 5000

App:
  Version: v0.1.0
  ReadinessTimeout: 2s

Auth:
  # Omitted or empty trusts all proxies; a non-empty CIDR list trusts only those sources.
  # With the default, isolate the API from users and overwrite forwarding headers at ingress.
  # Example allowlist: ["127.0.0.1/32", "::1/128"]
  TrustedProxies: []
  AccessSecret: ${DOGX_ACCESS_SECRET}
  SessionKeyPrefix: dogx:auth:session

Authorization:
  PolicyChannel: dogx:authorization:policy
  ReloadInterval: 60s

Postgres:
  Host: 127.0.0.1
  Port: 5432
  User: dogx
  Password: ${DOGX_POSTGRES_PASSWORD}
  Database: dogx_dev
  SSLMode: disable
  TimeZone: Asia/Shanghai
  MaxIdleConns: 5
  MaxOpenConns: 20
  ConnMaxLifetime: 1h

RedisConf:
  Host: 127.0.0.1:6379
  Type: node
  Pass: ${DOGX_REDIS_PASSWORD}
  NonBlock: true
  PingTimeout: 1s

SystemRpc:
  Endpoints:
    - 127.0.0.1:9001
  NonBlock: true
  Timeout: 2000
