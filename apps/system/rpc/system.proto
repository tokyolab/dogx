syntax = "proto3";

package system;

option go_package = "./system";

message ReadyRequest {}

message ReadyResponse {
  string status = 1;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string ip_address = 3;
  string user_agent = 4;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
}

message RefreshCredentialsRequest {
  string refresh_token = 1;
}

message EmptyResponse {}

message CurrentUserRequest {
  int64 user_id = 1;
}

message ProfileResponse {
  string username = 1;
  string nickname = 2;
  string email = 3;
  string phone = 4;
  string department_name = 5;
  repeated string roles = 6;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  string nickname = 2;
  string email = 3;
  string phone = 4;
}

message CurrentUserResponse {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
}

message RevokeSessionRequest {
  int64 user_id = 1;
  string session_id = 2;
}

message RevokeUserSessionsRequest {
  int64 user_id = 1;
}

message ChangePasswordRequest {
  int64 user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ReplaceRoleAPIsRequest {
  int64 role_id = 1;
  repeated int64 api_ids = 2;
}

message ListRolesRequest {
  int64 page = 1;
  int64 page_size = 2;
  string keyword = 3;
}

message RoleInfo {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  int32 sort = 5;
  int32 status = 6;
  string created_at = 7;
  string updated_at = 8;
  bool is_system = 9;
}

message CreateRoleRequest {
  string code = 1;
  string name = 2;
  string description = 3;
  int32 sort = 4;
  int32 status = 5;
}

message CreateRoleResponse {
  int64 id = 1;
}

message UpdateRoleRequest {
  int64 id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  int32 sort = 5;
}

message UpdateRoleStatusRequest {
  int64 id = 1;
  int32 status = 2;
}

message DeleteRoleRequest {
  int64 id = 1;
}

message ListRolesResponse {
  repeated RoleInfo items = 1;
  int64 total = 2;
}

message GetRoleRequest {
  int64 id = 1;
}

message GetRoleResponse {
  RoleInfo role = 1;
}

message ListAPIsRequest {
  string keyword = 1;
  string service_name = 2;
  string api_group = 3;
}

message APIInfo {
  int64 id = 1;
  string service_name = 2;
  string api_group = 3;
  string name = 4;
  string path = 5;
  string method = 6;
  bool is_required = 7;
  int32 status = 8;
  string remark = 9;
}

message ListAPIsResponse {
  repeated APIInfo items = 1;
}

message GetRoleAPIsRequest {
  int64 role_id = 1;
}

message GetRoleAPIsResponse {
  repeated int64 api_ids = 1;
}

message UserRoleInfo {
  int64 id = 1;
  string code = 2;
  string name = 3;
  int32 status = 4;
}

message UserInfo {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  string remark = 6;
  int32 status = 7;
  repeated UserRoleInfo roles = 8;
  string created_at = 9;
  string updated_at = 10;
  string last_login_at = 11;
  int64 department_id = 12;
  string department_name = 13;
}

message ListUsersRequest {
  int64 page = 1;
  int64 page_size = 2;
  string keyword = 3;
  optional int32 status = 4;
  optional int64 department_id = 5;
}

message ListUsersResponse {
  repeated UserInfo items = 1;
  int64 total = 2;
}

message GetUserRequest { int64 id = 1; }
message GetUserResponse { UserInfo user = 1; }

message CreateUserRequest {
  string username = 1;
  string nickname = 2;
  string password = 3;
  string email = 4;
  string phone = 5;
  string remark = 6;
  int32 status = 7;
  repeated int64 role_ids = 8;
  int64 department_id = 9;
}
message CreateUserResponse { int64 id = 1; }

message UpdateUserRequest {
  int64 id = 1;
  string nickname = 2;
  string email = 3;
  string phone = 4;
  string remark = 5;
  int64 operator_id = 6;
  int64 department_id = 7;
}
message UpdateUserStatusRequest {
  int64 id = 1;
  int32 status = 2;
  int64 operator_id = 3;
}
message DeleteUserRequest {
  int64 id = 1;
  int64 operator_id = 2;
}
message ReplaceUserRolesRequest {
  int64 id = 1;
  repeated int64 role_ids = 2;
  int64 operator_id = 3;
}
message ResetUserPasswordRequest {
  int64 id = 1;
  string password = 2;
  int64 operator_id = 3;
}
message ListUserRoleOptionsResponse {
  repeated UserRoleInfo items = 1;
  int64 total = 2;
}

message MenuFields {
  int64 parent_id = 1;
  int32 type = 2;
  string name = 3;
  string route_name = 4;
  string path = 5;
  string component = 6;
  string permission = 7;
  string icon = 8;
  int32 sort = 9;
  bool visible = 10;
  bool keep_alive = 11;
  bool external = 12;
  string remark = 13;
}
message MenuInfo {
  MenuFields menu = 1;
  int64 id = 2;
  int32 status = 3;
  string created_at = 4;
  string updated_at = 5;
}
message ListMenusRequest {}
message ListMenusResponse {
  repeated MenuInfo items = 1;
}
message GetMenuRequest {
  int64 id = 1;
}
message GetMenuResponse {
  MenuInfo menu = 1;
}
message CreateMenuRequest {
  MenuFields menu = 1;
  int32 status = 2;
}
message CreateMenuResponse {
  int64 id = 1;
}
message UpdateMenuRequest {
  int64 id = 1;
  MenuFields menu = 2;
}
message UpdateMenuStatusRequest {
  int64 id = 1;
  int32 status = 2;
}
message DeleteMenuRequest {
  int64 id = 1;
}

// Identity comes from verified JWT claims in the API, never from request JSON.
message ListNavigationMenusRequest {
  repeated int64 role_ids = 1;
  bool is_super_admin = 2;
}

message GetRoleMenusRequest { int64 role_id = 1; }
message GetRoleMenusResponse {
  repeated MenuInfo items = 1;
  repeated int64 menu_ids = 2;
}
message ReplaceRoleMenusRequest {
  int64 role_id = 1;
  repeated int64 menu_ids = 2;
}
message NavigationMenu {
  int64 id = 1;
  int64 parent_id = 2;
  int32 type = 3;
  string name = 4;
  string route_name = 5;
  string path = 6;
  string component = 7;
  string icon = 8;
  int32 sort = 9;
  bool visible = 10;
  bool keep_alive = 11;
  bool external = 12;
}

message DepartmentInfo {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  int32 sort = 4;
  int32 status = 5;
  string remark = 6;
  string created_at = 7;
  string updated_at = 8;
}
message ListDepartmentsRequest {}
message ListDepartmentsResponse { repeated DepartmentInfo items = 1; }
message GetDepartmentRequest { int64 id = 1; }
message GetDepartmentResponse { DepartmentInfo department = 1; }
message CreateDepartmentRequest {
  int64 parent_id = 1;
  string name = 2;
  int32 sort = 3;
  string remark = 4;
  int32 status = 5;
}
message CreateDepartmentResponse { int64 id = 1; }
message UpdateDepartmentRequest {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  int32 sort = 4;
  string remark = 5;
}
message UpdateDepartmentStatusRequest { int64 id = 1; int32 status = 2; }
message DeleteDepartmentRequest { int64 id = 1; }
message ListNavigationMenusResponse {
  repeated NavigationMenu items = 1;
  repeated string permissions = 2;
}

message ClearDictionaryCacheRequest {}

message DictionaryInfo {
  int64 id = 1;
  string name = 2;
  string code = 3;
  string remark = 4;
  int32 status = 5;
  bool is_public = 6;
  string created_at = 7;
  string updated_at = 8;
}

message DictionaryItemInfo {
  int64 id = 1;
  int64 dictionary_id = 2;
  string label = 3;
  string value = 4;
  int32 sort = 5;
  string remark = 6;
  int32 status = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListDictionariesRequest {

}

message ListDictionariesResponse {
  repeated DictionaryInfo items = 1;
}

message GetDictionaryRequest {
  int64 id = 1;
}

message GetDictionaryResponse {
  DictionaryInfo dictionary = 1;
}

message CreateDictionaryRequest {
  string name = 1;
  string code = 2;
  string remark = 3;
  int32 status = 4;
  bool is_public = 5;
}

message CreateDictionaryResponse {
  int64 id = 1;
}

message UpdateDictionaryRequest {
  int64 id = 1;
  string name = 2;
  string remark = 3;
  bool is_public = 4;
}

message UpdateDictionaryStatusRequest {
  int64 id = 1;
  int32 status = 2;
}

message DeleteDictionaryRequest {
  int64 id = 1;
}

message ListDictionaryItemsRequest {
  int64 dictionary_id = 1;
}

message ListDictionaryItemsResponse {
  repeated DictionaryItemInfo items = 1;
}

message GetDictionaryItemRequest {
  int64 id = 1;
}

message GetDictionaryItemResponse {
  DictionaryItemInfo item = 1;
}

message CreateDictionaryItemRequest {
  int64 dictionary_id = 1;
  string label = 2;
  string value = 3;
  int32 sort = 4;
  string remark = 5;
  int32 status = 6;
}

message CreateDictionaryItemResponse {
  int64 id = 1;
}

message UpdateDictionaryItemRequest {
  int64 id = 1;
  string label = 2;
  int32 sort = 3;
  string remark = 4;
}

message UpdateDictionaryItemStatusRequest {
  int64 id = 1;
  int32 status = 2;
}

message DeleteDictionaryItemRequest {
  int64 id = 1;
}

message ReadDictionariesRequest {
  repeated string codes = 1;
  bool public_only = 2;
}

message DictionaryOption {
  string label = 1;
  string value = 2;
  int32 sort = 3;
  int32 status = 4;
}

message DictionaryOptions {
  string code = 1;
  int32 status = 2;
  repeated DictionaryOption items = 3;
}

message ReadDictionariesResponse {
  repeated DictionaryOptions items = 1;
}

service System {
  rpc ListLoginLogs(ListLoginLogsRequest) returns (ListLoginLogsResponse);
  rpc ListDictionaries(ListDictionariesRequest) returns (ListDictionariesResponse);
  rpc GetDictionary(GetDictionaryRequest) returns (GetDictionaryResponse);
  rpc CreateDictionary(CreateDictionaryRequest) returns (CreateDictionaryResponse);
  rpc UpdateDictionary(UpdateDictionaryRequest) returns (EmptyResponse);
  rpc UpdateDictionaryStatus(UpdateDictionaryStatusRequest) returns (EmptyResponse);
  rpc DeleteDictionary(DeleteDictionaryRequest) returns (EmptyResponse);
  rpc ListDictionaryItems(ListDictionaryItemsRequest) returns (ListDictionaryItemsResponse);
  rpc GetDictionaryItem(GetDictionaryItemRequest) returns (GetDictionaryItemResponse);
  rpc CreateDictionaryItem(CreateDictionaryItemRequest) returns (CreateDictionaryItemResponse);
  rpc UpdateDictionaryItem(UpdateDictionaryItemRequest) returns (EmptyResponse);
  rpc UpdateDictionaryItemStatus(UpdateDictionaryItemStatusRequest) returns (EmptyResponse);
  rpc DeleteDictionaryItem(DeleteDictionaryItemRequest) returns (EmptyResponse);
  rpc ClearDictionaryCache(ClearDictionaryCacheRequest) returns (EmptyResponse);
  rpc ReadDictionaries(ReadDictionariesRequest) returns (ReadDictionariesResponse);
  rpc GetProfile(CurrentUserRequest) returns (ProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (EmptyResponse);
  rpc GetRoleMenus(GetRoleMenusRequest) returns (GetRoleMenusResponse);
  rpc ReplaceRoleMenus(ReplaceRoleMenusRequest) returns (EmptyResponse);
  rpc ListNavigationMenus(ListNavigationMenusRequest) returns (ListNavigationMenusResponse);
  rpc ListMenus(ListMenusRequest) returns (ListMenusResponse);
  rpc GetMenu(GetMenuRequest) returns (GetMenuResponse);
  rpc CreateMenu(CreateMenuRequest) returns (CreateMenuResponse);
  rpc UpdateMenu(UpdateMenuRequest) returns (EmptyResponse);
  rpc UpdateMenuStatus(UpdateMenuStatusRequest) returns (EmptyResponse);
  rpc DeleteMenu(DeleteMenuRequest) returns (EmptyResponse);
  rpc CheckReady(ReadyRequest) returns (ReadyResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshCredentials(RefreshCredentialsRequest) returns (LoginResponse);
  rpc GetCurrentUser(CurrentUserRequest) returns (CurrentUserResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (EmptyResponse);
  rpc RevokeUserSessions(RevokeUserSessionsRequest) returns (EmptyResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (EmptyResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (EmptyResponse);
  rpc UpdateRoleStatus(UpdateRoleStatusRequest) returns (EmptyResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (EmptyResponse);
  rpc ListAPIs(ListAPIsRequest) returns (ListAPIsResponse);
  rpc GetRoleAPIs(GetRoleAPIsRequest) returns (GetRoleAPIsResponse);
  rpc ReplaceRoleAPIs(ReplaceRoleAPIsRequest) returns (EmptyResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (EmptyResponse);
  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (EmptyResponse);
  rpc DeleteUser(DeleteUserRequest) returns (EmptyResponse);
  rpc ReplaceUserRoles(ReplaceUserRolesRequest) returns (EmptyResponse);
  rpc ResetUserPassword(ResetUserPasswordRequest) returns (EmptyResponse);
  rpc ListUserRoleOptions(ListRolesRequest) returns (ListUserRoleOptionsResponse);
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc GetDepartment(GetDepartmentRequest) returns (GetDepartmentResponse);
  rpc CreateDepartment(CreateDepartmentRequest) returns (CreateDepartmentResponse);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (EmptyResponse);
  rpc UpdateDepartmentStatus(UpdateDepartmentStatusRequest) returns (EmptyResponse);
  rpc DeleteDepartment(DeleteDepartmentRequest) returns (EmptyResponse);
}

message ListLoginLogsRequest {
  int64 page = 1;
  int64 page_size = 2;
  string username = 3;
  string result = 4;
}

message LoginLogInfo {
  int64 id = 1;
  string username = 2;
  bool success = 3;
  string failure_reason = 4;
  string ip_address = 5;
  string user_agent = 6;
  string created_at = 7;
}

message ListLoginLogsResponse {
  repeated LoginLogInfo items = 1;
  int64 total = 2;
}
