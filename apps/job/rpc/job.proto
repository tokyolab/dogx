syntax = "proto3";
package job;
option go_package = "./job";

message JobInput {
  string name = 1;
  string remark = 2;
  int64 executor_group_id = 3;
  string processor_name = 4;
  optional int32 execution_mode = 5;
  optional bool post_enabled = 6;
  string params = 7;
  string cron_expr = 8;
  optional int32 misfire_policy = 9;
  optional int32 block_policy = 10;
  optional int32 max_retries = 11;
  optional int32 retry_interval_seconds = 12;
  int32 timeout_seconds = 13;
}
message ListJobsRequest {
  int64 page = 1;
  int64 page_size = 2;
  optional int64 id = 3;
  string name = 4;
  optional int64 executor_group_id = 5;
  optional int32 status = 6;
}
message GetJobRequest { int64 id = 1; }
message CreateJobRequest { JobInput config = 1; optional int32 status = 2; }
message UpdateJobRequest { int64 id = 1; JobInput config = 2; }
message UpdateJobStatusRequest { int64 id = 1; optional int32 status = 2; }
message DeleteJobRequest { int64 id = 1; }
message PreviewJobCronRequest { string cron_expr = 1; }
message TriggerJobRequest {
  int64 id = 1;
  string request_id = 2;
  optional bool params_overridden = 3;
  optional string params = 4;
  int64 operator_id = 5;
}
message JobListItem {
  int64 id = 1;
  string name = 2;
  int64 executor_group_id = 3;
  optional string executor_group_name = 4;
  string processor_name = 5;
  int32 execution_mode = 6;
  string cron_expr = 7;
  int32 status = 8;
  optional string next_trigger_at = 9;
  string created_at = 10;
  string updated_at = 11;
}
message JobInfo {
  int64 id = 1;
  string name = 2;
  int64 executor_group_id = 3;
  optional string executor_group_name = 4;
  string processor_name = 5;
  int32 execution_mode = 6;
  string cron_expr = 7;
  int32 status = 8;
  optional string next_trigger_at = 9;
  string created_at = 10;
  string updated_at = 11;
  string remark = 12;
  bool post_enabled = 13;
  string params = 14;
  int32 misfire_policy = 15;
  int32 block_policy = 16;
  int32 max_retries = 17;
  int32 retry_interval_seconds = 18;
  int32 timeout_seconds = 19;
}
message ListJobsResponse { repeated JobListItem items = 1; int64 total = 2; }
message GetJobResponse { JobInfo job = 1; }
message CreateJobResponse { int64 id = 1; }
message PreviewJobCronResponse { repeated string times = 1; }
message TriggerJobResponse { int64 instance_id = 1; }
// Group identities are exact and immutable; credentials are generated by the server.
message CreateExecutorGroupRequest { string name = 1; string discovery_key = 2; }
message CreateExecutorGroupResponse { int64 id = 1; }
message GetExecutorGroupRequest { int64 id = 1; }
message ExecutorGroupInfo {
  int64 id = 1;
  string name = 2;
  string discovery_key = 3;
  // Full plaintext credential. Disable body logging on both sides of this RPC.
  string token = 4;
  string created_at = 5;
  string updated_at = 6;
}
message GetExecutorGroupResponse { ExecutorGroupInfo group = 1; }
message ListExecutorGroupsRequest { int64 page = 1; int64 page_size = 2; string name = 3; }
message ExecutorGroupListItem {
  int64 id = 1;
  string name = 2;
  string discovery_key = 3;
  string created_at = 4;
  string updated_at = 5;
}
message ListExecutorGroupsResponse { repeated ExecutorGroupListItem items = 1; int64 total = 2; }
message DeleteExecutorGroupRequest { int64 id = 1; }
message GetInstanceRequest { int64 id = 1; }
// ExecutionConfigInfo describes the immutable snapshot saved for this round.
message ExecutionConfigInfo {
  int32 schema_version = 1;
  string processor_name = 2;
  int32 execution_mode = 3;
  bool post_enabled = 4;
  string params = 5;
  int32 max_retries = 6;
  int32 retry_interval_seconds = 7;
  int32 timeout_seconds = 8;
}
// InstanceInfo remains readable after the current Job or group is deleted.
// Optional fields preserve absence; times use RFC3339 with fractional seconds.
message InstanceInfo {
  int64 id = 1;
  int64 job_id = 2;
  string job_name = 3;
  int64 executor_group_id = 4;
  int32 trigger_type = 5;
  optional string scheduled_at = 6;
  optional string request_id = 7;
  bool params_overridden = 8;
  optional int64 triggered_by = 9;
  ExecutionConfigInfo execution_config = 10;
  int32 status = 11;
  optional string started_at = 12;
  optional string deadline_at = 13;
  optional string finished_at = 14;
  optional string end_reason = 15;
  optional string result_summary = 16;
  string created_at = 17;
  string updated_at = 18;
}
message GetInstanceResponse { InstanceInfo instance = 1; }
message StopInstanceRequest { int64 id = 1; }
// StopInstanceResponse reports the committed stop decision or the existing state.
// It does not confirm child cancellation or executor termination.
message StopInstanceResponse {
  int64 instance_id = 1;
  int32 status = 2;
  optional string end_reason = 3;
}
message ListInstanceTasksRequest { int64 instance_id = 1; int64 page = 2; int64 page_size = 3; }
// TaskListItem omits business result_data. A retained summary may belong to the
// previous attempt and does not prove the current attempt has finished.
message TaskListItem {
  int64 id = 1;
  int64 instance_id = 2;
  int32 task_type = 3;
  int32 status = 4;
  int64 attempt_no = 5;
  int32 used_attempts = 6;
  optional string attempt_registered_at = 7;
  optional string next_dispatch_at = 8;
  optional string executor_instance_id = 9;
  optional string executor_address = 10;
  optional string result_summary = 11;
  optional string end_reason = 12;
  optional string started_at = 13;
  optional string finished_at = 14;
  string created_at = 15;
  string updated_at = 16;
}
message ListInstanceTasksResponse { repeated TaskListItem items = 1; int64 total = 2; }
message EmptyResponse {}
service Job {
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc UpdateJob(UpdateJobRequest) returns (EmptyResponse);
  rpc UpdateJobStatus(UpdateJobStatusRequest) returns (EmptyResponse);
  rpc DeleteJob(DeleteJobRequest) returns (EmptyResponse);
  rpc PreviewJobCron(PreviewJobCronRequest) returns (PreviewJobCronResponse);
  rpc TriggerJob(TriggerJobRequest) returns (TriggerJobResponse);
  rpc CreateExecutorGroup(CreateExecutorGroupRequest) returns (CreateExecutorGroupResponse);
  rpc GetExecutorGroup(GetExecutorGroupRequest) returns (GetExecutorGroupResponse);
  rpc ListExecutorGroups(ListExecutorGroupsRequest) returns (ListExecutorGroupsResponse);
  rpc DeleteExecutorGroup(DeleteExecutorGroupRequest) returns (EmptyResponse);
  rpc GetInstance(GetInstanceRequest) returns (GetInstanceResponse);
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse);
  rpc ListInstanceTasks(ListInstanceTasksRequest) returns (ListInstanceTasksResponse);
}
